[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaziforce-knowledge-graph"
version = "0.1.0"
description = "ESCO-backed knowledge graph with Kenya-specific informal trade vocabulary"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

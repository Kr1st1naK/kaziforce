[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaziforce-api"
version = "0.1.0"
description = "Flask REST API and hybrid recommendation engine for KaziForce"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaziforce_api = ["data/migrations/*.sql"]
